<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-label="How each lookup is handled: six checks decide whether it stays linked to the original or the looked-up record is copied">
  <title>How each lookup is handled</title>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1e293b; }
    .q { font-size: 13px; }
    .yn { font-size: 10.5px; font-weight: 700; fill: #64748b; }
    .qb { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .ln { stroke: #64748b; stroke-width: 1.5; fill: none; }
    .ly { stroke: #d97706; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
  </defs>

  <rect x="0" y="0" width="760" height="560" rx="12" fill="#ffffff"/>

  <!-- Start -->
  <rect x="40" y="20" width="380" height="42" rx="21" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="230" y="46" font-size="13" font-weight="700" text-anchor="middle">For each lookup on a record being copied</text>
  <line class="ln" x1="230" y1="62" x2="230" y2="90" marker-end="url(#ag)"/>

  <!-- Questions -->
  <rect class="qb" x="40" y="92" width="380" height="42" rx="6"/>
  <text class="q" x="230" y="118" text-anchor="middle">Is it the master record (this record is the detail)?</text>
  <rect class="qb" x="40" y="156" width="380" height="42" rx="6"/>
  <text class="q" x="230" y="182" text-anchor="middle">Is it a User, queue, group or role?</text>
  <rect class="qb" x="40" y="220" width="380" height="42" rx="6"/>
  <text class="q" x="230" y="246" text-anchor="middle">Is the object in “Objects to link instead of copy”?</text>
  <rect class="qb" x="40" y="284" width="380" height="42" rx="6"/>
  <text class="q" x="230" y="310" text-anchor="middle">Is it a system object, or one that can't be created?</text>
  <rect class="qb" x="40" y="348" width="380" height="42" rx="6"/>
  <text class="q" x="230" y="374" text-anchor="middle">Is it past the copy depth limit?</text>
  <rect class="qb" x="40" y="412" width="380" height="42" rx="6"/>
  <text class="q" x="230" y="438" text-anchor="middle">Did you pick “Use original”, or is it hidden from you?</text>

  <!-- No arrows -->
  <line class="ln" x1="230" y1="134" x2="230" y2="154" marker-end="url(#ag)"/><text class="yn" x="238" y="148">No</text>
  <line class="ln" x1="230" y1="198" x2="230" y2="218" marker-end="url(#ag)"/><text class="yn" x="238" y="212">No</text>
  <line class="ln" x1="230" y1="262" x2="230" y2="282" marker-end="url(#ag)"/><text class="yn" x="238" y="276">No</text>
  <line class="ln" x1="230" y1="326" x2="230" y2="346" marker-end="url(#ag)"/><text class="yn" x="238" y="340">No</text>
  <line class="ln" x1="230" y1="390" x2="230" y2="410" marker-end="url(#ag)"/><text class="yn" x="238" y="404">No</text>
  <line class="ln" x1="230" y1="454" x2="230" y2="484" marker-end="url(#ag)"/><text class="yn" x="238" y="472">No</text>

  <!-- Yes arrows -->
  <line class="ly" x1="420" y1="113" x2="518" y2="113" marker-end="url(#al)"/><text class="yn" x="458" y="108" fill="#b45309">Yes</text>
  <line class="ly" x1="420" y1="177" x2="518" y2="177" marker-end="url(#al)"/><text class="yn" x="458" y="172" fill="#b45309">Yes</text>
  <line class="ly" x1="420" y1="241" x2="518" y2="241" marker-end="url(#al)"/><text class="yn" x="458" y="236" fill="#b45309">Yes</text>
  <line class="ly" x1="420" y1="305" x2="518" y2="305" marker-end="url(#al)"/><text class="yn" x="458" y="300" fill="#b45309">Yes</text>
  <line class="ly" x1="420" y1="369" x2="518" y2="369" marker-end="url(#al)"/><text class="yn" x="458" y="364" fill="#b45309">Yes</text>
  <line class="ly" x1="420" y1="433" x2="518" y2="433" marker-end="url(#al)"/><text class="yn" x="458" y="428" fill="#b45309">Yes</text>

  <!-- Linked outcome -->
  <rect x="520" y="92" width="210" height="362" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="625" y="252" font-size="15" font-weight="700" text-anchor="middle">Keep it linked</text>
  <text x="625" y="276" font-size="12" text-anchor="middle">The copy's lookup points at</text>
  <text x="625" y="294" font-size="12" text-anchor="middle">the original record.</text>

  <!-- Copy outcome -->
  <rect x="40" y="486" width="380" height="54" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="230" y="508" font-size="13" font-weight="700" text-anchor="middle">Copy the looked-up record too</text>
  <text x="230" y="527" font-size="12" text-anchor="middle">and point the lookup at the new copy</text>

  <!-- Recursion loop -->
  <path d="M40,513 H16 V41 H38" stroke="#059669" stroke-width="1.5" fill="none" marker-end="url(#ac)"/>
  <text transform="translate(32,280) rotate(-90)" font-size="10.5" fill="#047857" text-anchor="middle">then check the new copy's lookups the same way</text>
</svg>
