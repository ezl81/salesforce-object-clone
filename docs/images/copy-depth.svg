<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290" role="img" aria-label="Copy depth limit: 0 copies only the record, 1 also copies the records it looks up to, blank copies the whole chain">
  <title>Copy depth limit</title>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1e293b; }
    .hd { font-size: 11px; font-weight: 700; fill: #64748b; letter-spacing: 1px; }
    .rl { font-size: 14px; font-weight: 700; }
    .t { font-size: 11px; fill: #64748b; }
    .n { font-size: 13px; font-weight: 600; }
    .cap { font-size: 12px; fill: #475569; }
    .orig { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .copy { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
    .lk { stroke: #64748b; stroke-width: 1.5; fill: none; }
    .lkc { stroke: #059669; stroke-width: 2; fill: none; }
    .lkl { stroke: #d97706; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <g id="labels">
      <text class="t" x="182" y="17">Opportunity</text><text class="n" x="182" y="35">Big Deal</text>
      <text class="t" x="362" y="17">Account</text><text class="n" x="362" y="35">Acme</text>
      <text class="t" x="542" y="17">Account (parent)</text><text class="n" x="542" y="35">Acme Holdings</text>
      <text class="t" x="722" y="17">Account (grandparent)</text><text class="n" x="722" y="35">Acme Global</text>
    </g>
  </defs>

  <rect x="0" y="0" width="880" height="290" rx="12" fill="#ffffff"/>

  <text class="hd" x="20" y="28">DEPTH LIMIT</text>
  <text class="hd" x="240" y="28" text-anchor="middle">LEVEL 0</text>
  <text class="hd" x="420" y="28" text-anchor="middle">LEVEL 1</text>
  <text class="hd" x="600" y="28" text-anchor="middle">LEVEL 2</text>
  <text class="hd" x="780" y="28" text-anchor="middle">LEVEL 3</text>

  <!-- Depth 0 -->
  <g transform="translate(0,44)">
    <text class="rl" x="20" y="27">0</text>
    <rect class="copy" x="170" y="0" width="140" height="44" rx="6"/>
    <rect class="orig" x="350" y="0" width="140" height="44" rx="6"/>
    <rect class="orig" x="530" y="0" width="140" height="44" rx="6"/>
    <rect class="orig" x="710" y="0" width="140" height="44" rx="6"/>
    <use href="#labels"/>
    <line class="lkl" x1="310" y1="22" x2="348" y2="22" marker-end="url(#al)"/>
    <line class="lk" x1="490" y1="22" x2="528" y2="22" marker-end="url(#ag)"/>
    <line class="lk" x1="670" y1="22" x2="708" y2="22" marker-end="url(#ag)"/>
  </g>

  <!-- Depth 1 -->
  <g transform="translate(0,114)">
    <text class="rl" x="20" y="27">1</text>
    <rect class="copy" x="170" y="0" width="140" height="44" rx="6"/>
    <rect class="copy" x="350" y="0" width="140" height="44" rx="6"/>
    <rect class="orig" x="530" y="0" width="140" height="44" rx="6"/>
    <rect class="orig" x="710" y="0" width="140" height="44" rx="6"/>
    <use href="#labels"/>
    <line class="lkc" x1="310" y1="22" x2="348" y2="22" marker-end="url(#ac)"/>
    <line class="lkl" x1="490" y1="22" x2="528" y2="22" marker-end="url(#al)"/>
    <line class="lk" x1="670" y1="22" x2="708" y2="22" marker-end="url(#ag)"/>
  </g>

  <!-- No limit -->
  <g transform="translate(0,184)">
    <text class="rl" x="20" y="27">Blank</text>
    <text class="t" x="20" y="42">(no limit)</text>
    <rect class="copy" x="170" y="0" width="140" height="44" rx="6"/>
    <rect class="copy" x="350" y="0" width="140" height="44" rx="6"/>
    <rect class="copy" x="530" y="0" width="140" height="44" rx="6"/>
    <rect class="copy" x="710" y="0" width="140" height="44" rx="6"/>
    <use href="#labels"/>
    <line class="lkc" x1="310" y1="22" x2="348" y2="22" marker-end="url(#ac)"/>
    <line class="lkc" x1="490" y1="22" x2="528" y2="22" marker-end="url(#ac)"/>
    <line class="lkc" x1="670" y1="22" x2="708" y2="22" marker-end="url(#ac)"/>
  </g>

  <!-- Legend -->
  <g transform="translate(20,256)">
    <rect class="orig" x="0" y="0" width="18" height="14" rx="3"/><text class="cap" x="26" y="12">Original record</text>
    <rect class="copy" x="140" y="0" width="18" height="14" rx="3"/><text class="cap" x="166" y="12">New copy</text>
    <line class="lk" x1="250" y1="7" x2="290" y2="7" marker-end="url(#ag)"/><text class="cap" x="298" y="12">Lookup</text>
    <line class="lkc" x1="370" y1="7" x2="410" y2="7" marker-end="url(#ac)"/><text class="cap" x="418" y="12">Lookup to a new copy</text>
    <line class="lkl" x1="560" y1="7" x2="600" y2="7" marker-end="url(#al)"/><text class="cap" x="608" y="12">Lookup kept on the original record</text>
  </g>
</svg>
